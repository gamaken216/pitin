<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動ブログ バックナンバー | フレッシュテニスクラブ ピットイン</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%231f8a4c' stroke-width='7'/><path d='M14 32 Q50 50 14 68 M86 32 Q50 50 86 68' fill='none' stroke='%231f8a4c' stroke-width='5'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c211e; --paper: #f6f3ea; --line: rgba(28,33,30,0.16); --line-strong: rgba(28,33,30,0.42);
      --muted: #6a6f68; --green: #1f8a4c; --green-dark: #18713e; --green-deep: #123a26; --green-soft: #8fd6a8;
      --sans: 'Zen Kaku Gothic New', sans-serif; --grotesk: 'Archivo', 'Zen Kaku Gothic New', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.7; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    .kicker { font-family: var(--grotesk); font-weight: 600; font-size: 0.7rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
    .num { font-family: var(--grotesk); font-weight: 800; font-size: 0.82rem; letter-spacing: 0.08em; color: var(--green); }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(246,243,234,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-strong); display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1.6rem; }
    .nav-logo { font-family: var(--grotesk); font-weight: 800; font-size: 1.05rem; letter-spacing: 0.16em; text-decoration: none; }
    .nav-logo b { color: var(--green); }
    .nav-back { font-size: 0.78rem; font-weight: 700; text-decoration: none; letter-spacing: 0.04em; border-bottom: 2px solid var(--green); padding-bottom: 2px; transition: color 0.15s; }
    .nav-back:hover { color: var(--green); }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 1.6rem; }
    main { padding: 8rem 0 5rem; }
    .sec-head { margin-bottom: 2.4rem; }
    .sec-head .meta { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.8rem; }
    .sec-head .meta::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .sec-title { font-weight: 900; font-size: clamp(1.7rem, 4vw, 2.4rem); line-height: 1.3; }

    .blog-list { border-top: 2px solid var(--ink); }
    .post { display: grid; grid-template-columns: 110px 1fr 200px; gap: 2rem; padding: 1.9rem 0; border-bottom: 1px solid var(--line); text-decoration: none; align-items: start; transition: background 0.15s; }
    .post:hover { background: rgba(31,138,76,0.05); }
    .post:hover h3 { color: var(--green); }
    .post .date { font-family: var(--grotesk); font-size: 0.74rem; letter-spacing: 0.04em; color: var(--muted); padding-top: 0.2rem; }
    .post .body h3 { font-weight: 900; font-size: 1.12rem; line-height: 1.5; margin-bottom: 0.5rem; transition: color 0.15s; }
    .post .body p { font-size: 0.88rem; color: #57594f; line-height: 1.8; }
    .post .body .more { display: inline-block; margin-top: 0.6rem; font-family: var(--grotesk); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--green); }
    .post .thumb img { width: 100%; aspect-ratio: 16/10; object-fit: cover; }
    .post .thumb-ph { width: 100%; aspect-ratio: 16/10; background: var(--green-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; }
    .post .thumb-ph svg { width: 44px; height: 44px; }
    .post .thumb-ph span { font-family: var(--grotesk); font-weight: 800; font-size: 0.6rem; letter-spacing: 0.18em; color: var(--green-soft); }

    .back-home { margin-top: 2.6rem; }
    .back-home a { font-family: var(--grotesk); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; color: var(--green); border-bottom: 2px solid var(--green); padding-bottom: 3px; }

    footer { background: var(--green-deep); color: rgba(246,243,234,0.6); padding: 3.2rem 0; margin-top: 4rem; }
    footer .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    footer .fw-logo { font-family: var(--grotesk); font-weight: 800; letter-spacing: 0.16em; color: var(--paper); font-size: 1rem; }
    footer .fw-logo b { color: var(--green-soft); }
    footer small { font-size: 0.74rem; letter-spacing: 0.04em; }

    @media (max-width: 860px) {
      .post { grid-template-columns: 1fr; gap: 0.7rem; }
      .post .thumb { order: -1; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">PIT<b>·</b>INN</a>
  <a href="index.html#blog" class="nav-back">← トップへ戻る</a>
</nav>

<main>
  <div class="wrap">
    <div class="sec-head">
      <div class="meta"><span class="num">08</span><span class="kicker">Blog Archive</span></div>
      <h1 class="sec-title">活動ブログ バックナンバー</h1>
    </div>
    <div class="blog-list" id="blog-list"></div>
    <div class="back-home"><a href="index.html#blog">← トップページへ戻る</a></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="fw-logo">PIT<b>·</b>INN</div>
    <small>© 2025 フレッシュテニスクラブ ピットイン ／ 富山市</small>
  </div>
</footer>

<script src="posts.js"></script>
<script>
// アーカイブページは全件表示
renderPosts('blog-list', 0);
</script>

</body>
</html>
